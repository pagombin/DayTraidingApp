syntax = "proto3";
package health;
option go_package = "trading-platform/proto/health";

message HealthCheck {
  string service_name = 1;
  string status = 2;
  string timestamp = 3;
  int32 response_time_ms = 4;
  string details = 5;
}

message HealthReport {
  repeated HealthCheck services = 1;
}
